<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>メイン訴求 インパクト版 1080x560</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0f1d;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0;
    font-family: 'Noto Sans CJK JP', 'Noto Sans JP', 'Source Han Sans JP', 'Hiragino Sans', sans-serif; color: #eef3ff; }
  .num { font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
  #stage { width: 1080px; height: 560px; background: repeating-linear-gradient(45deg, #ffd400 0, #ffd400 22px, #111 22px, #111 44px); }
  .panel { position: absolute; left: 18px; top: 18px; width: 1044px; height: 524px; background: #000; }
  .banner { position: absolute; left: 0; top: 0; width: 1044px; height: 88px; background: #e60012; color: #fff;
    line-height: 88px; padding-left: 30px; box-sizing: border-box; font-size: 46px; font-weight: 900; letter-spacing: .04em;
    white-space: nowrap; text-shadow: 3px 3px 0 #000; }
  .main { position: absolute; left: 26px; top: 100px; font-size: 112px; font-weight: 900; line-height: 1.15;
    white-space: nowrap; color: #ff1414; text-shadow: 0 0 0 #fff, 4px 4px 0 #fff, -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff, 6px 0 0 #fff, -6px 0 0 #fff, 0 6px 0 #fff, 0 -6px 0 #fff, 10px 10px 0 #000;
    transform-origin: 40% 50%; animation: pulse .9s ease-in-out infinite; }
  .main .bang { display: inline-block; animation: shake .35s linear infinite; }
  .sub { position: absolute; left: 0; top: 262px; width: 1044px; text-align: center; font-size: 48px; font-weight: 900;
    color: #ffd400; white-space: nowrap; text-shadow: 3px 3px 0 #e60012; }
  .sub u { text-decoration: none; border-bottom: 6px solid #e60012; }
  .box { position: absolute; top: 340px; width: 324px; height: 166px; background: #e60012; border: 6px solid #ffd400;
    box-sizing: border-box; text-align: center; animation: flash 1.2s steps(1) infinite; }
  .box .t { margin-top: 20px; font-size: 40px; font-weight: 900; color: #ffd400; white-space: nowrap;
    text-shadow: 3px 3px 0 #000; }
  .box .s { margin-top: 8px; font-size: 28px; font-weight: 900; color: #fff; white-space: nowrap; }
  .b2 { animation-delay: .4s; } .b3 { animation-delay: .8s; }

  .burst { position: absolute; left: 862px; top: 2px; width: 210px; height: 210px; background: #ffd400;
    -webkit-clip-path: polygon(50% 0%,61% 18%,79% 6%,79% 27%,98% 25%,88% 43%,100% 57%,81% 64%,88% 84%,68% 80%,61% 100%,50% 85%,39% 100%,32% 80%,12% 84%,19% 64%,0% 57%,12% 43%,2% 25%,21% 27%,21% 6%,39% 18%);
    clip-path: polygon(50% 0%,61% 18%,79% 6%,79% 27%,98% 25%,88% 43%,100% 57%,81% 64%,88% 84%,68% 80%,61% 100%,50% 85%,39% 100%,32% 80%,12% 84%,19% 64%,0% 57%,12% 43%,2% 25%,21% 27%,21% 6%,39% 18%);
    animation: wobble 1.1s ease-in-out infinite; }
  .burst .in { position: absolute; left: 0; top: 54px; width: 210px; text-align: center; color: #e60012;
    font-size: 40px; font-weight: 900; line-height: 1.1; }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes shake { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(3px,-3px) rotate(6deg); }
    50% { transform: translate(-3px,2px) rotate(-6deg); } 75% { transform: translate(2px,3px) rotate(4deg); } 100% { transform: translate(0,0) rotate(0); } }
  @keyframes flash { 0% { background: #e60012; border-color: #ffd400; } 50% { background: #b0000c; border-color: #fff; } }
  @keyframes wobble { 0%,100% { transform: rotate(-14deg) scale(1); } 50% { transform: rotate(-4deg) scale(1.1); } }
</style>
</head>
<body>
<div id="stage">
  <div class="panel">
    <div class="banner">工事現場向け！充電式モニター</div>
    <div class="main">コンセント不要<span class="bang">！</span></div>
    <div class="sub">バッテリーで動く<u>43インチ</u>モニター</div>
    <div class="box b1" style="left:14px"><div class="t">電源工事ゼロ！</div><div class="s">置くだけ即使える</div></div>
    <div class="box b2" style="left:360px"><div class="t">遠くから変更！</div><div class="s">事務所から表示切替</div></div>
    <div class="box b3" style="left:706px"><div class="t">移動ラクラク！</div><div class="s">現場のどこでもOK</div></div>
  </div>
  <div class="burst"><div class="in">電源<br>いらず!</div></div>
</div>
<script>
  /* 表示される枠の大きさに合わせて、デザイン全体を縮小する */
  (function () {
    var W = 1080, H = 560, st = document.getElementById('stage');
    function fit() {
      var vv = window.visualViewport;
      var w = Math.max(1, (vv && vv.width) || window.innerWidth || W);
      var h = Math.max(1, (vv && vv.height) || window.innerHeight || H);
      var s = Math.min(w / W, h / H, 1);
      if (!(s > 0) || !isFinite(s)) s = 1;
      st.style.transform = (s === 1) ? 'none' : 'scale(' + s + ')';
      document.documentElement.style.width = w + 'px';
      document.documentElement.style.height = h + 'px';
      document.body.style.width = w + 'px';
      document.body.style.height = h + 'px';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 50); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
    fit(); setTimeout(fit, 0); setTimeout(fit, 100); setTimeout(fit, 500); setTimeout(fit, 2000);
  })();
</script>
</body>
</html>
