<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=304, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>使用シーン 304x1000</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0f1d;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0;
    font-family: 'Noto Sans CJK JP', 'Noto Sans JP', 'Source Han Sans JP', 'Hiragino Sans', sans-serif; color: #eef3ff; }
  .num { font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
  #stage { width: 304px; height: 1000px;
    background: linear-gradient(180deg, #0d1426 0%, #0a0f1d 60%, #0c1a2a 100%); }
  .edge { position: absolute; left: 0; top: 0; width: 2px; height: 1000px;
    background: linear-gradient(180deg, rgba(62,240,196,.0), rgba(62,240,196,.55) 50%, rgba(58,160,255,0)); }
  .eyebrow { position: absolute; left: 30px; top: 44px; font-weight: 300; font-size: 16px; letter-spacing: .34em; opacity: .65; }
  .title { position: absolute; left: 28px; top: 70px; font-size: 40px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
  .title .grad { background: linear-gradient(90deg, #3ef0c4, #3aa0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .list { position: absolute; left: 24px; top: 158px; width: 256px; height: 690px; }
  .row { position: absolute; left: 0; width: 254px; height: 116px; border-radius: 16px;
    border: 1px solid rgba(238,243,255,.16); background: rgba(238,243,255,.03);
    transition: background .6s ease, border-color .6s ease; }
  .row svg { position: absolute; left: 18px; top: 34px; width: 48px; height: 48px; }
  .row svg * { stroke: rgba(238,243,255,.72); transition: stroke .6s ease; }
  .row .t { position: absolute; left: 76px; top: 0; line-height: 116px; font-size: 22px; font-weight: 500;
    letter-spacing: .02em; white-space: nowrap; }
  .row.on { border-color: rgba(62,240,196,.85); background: rgba(62,240,196,.12); }
  .row.on svg * { stroke: #3ef0c4; }

  .note { position: absolute; left: 0; width: 304px; top: 880px; text-align: center; font-size: 20px;
    font-weight: 300; line-height: 1.6; opacity: .8; }
  .note b { font-weight: 500; color: #3ef0c4; }
</style>
</head>
<body>
<div id="stage">
  <div class="edge"></div>
  <div class="eyebrow num">USE&nbsp;CASES</div>
  <div class="title"><span class="grad">こんな場所</span>に</div>
  <div class="list">
    <div class="row" style="top:0px">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16 L10 6 H38 L42 16 Z M6 16 Q6 21 12 21 Q18 21 18 16 Q18 21 24 21 Q30 21 30 16 Q30 21 36 21 Q42 21 42 16 M9 21 V42 H39 V21 M19 42 V30 H29 V42"/></svg>
      <div class="t">店頭・ショップ</div>
    </div>
    <div class="row" style="top:136px">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 26 H44 M8 26 V42 M40 26 V42 M24 6 V9 M14 20 A10 10 0 0 1 34 20 Z M10 20 H38"/></svg>
      <div class="t">受付・ロビー</div>
    </div>
    <div class="row" style="top:272px">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42 V6 M10 8 L36 13 L10 20 M4 42 H44 M26 42 L32 28 L38 42"/></svg>
      <div class="t">イベント会場</div>
    </div>
    <div class="row" style="top:408px">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8 H42 V30 H6 Z M24 30 V40 M14 42 L24 36 L34 42 M14 18 L20 22 L28 14 L34 20"/></svg>
      <div class="t">展示会ブース</div>
    </div>
    <div class="row" style="top:544px">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42 V6 H30 V42 M30 18 H40 V42 M4 42 H44 M16 12 H18 M22 12 H24 M16 20 H18 M22 20 H24 M16 28 H18 M22 28 H24 M35 26 V27 M35 33 V34"/></svg>
      <div class="t">オフィス・会議室</div>
    </div>
  </div>
  <div class="note">コンセントがなくても<br><b>置くだけで、すぐ表示</b></div>
</div>

<script>
  /* 1つずつ順番に光らせる（秒） */
  var HIGHLIGHT_SEC = 2.5;
  var rows = document.querySelectorAll('.row'), cur = -1;
  function next() {
    cur = (cur + 1) % rows.length;
    for (var k = 0; k < rows.length; k++) rows[k].className = 'row' + (k === cur ? ' on' : '');
  }
  next(); setInterval(next, HIGHLIGHT_SEC * 1000);
</script>
<script>
  /* 表示される枠の大きさに合わせて、デザイン全体を縮小する */
  (function () {
    var W = 304, H = 1000, st = document.getElementById('stage');
    function fit() {
      var vv = window.visualViewport;
      var w = Math.max(1, (vv && vv.width) || window.innerWidth || W);
      var h = Math.max(1, (vv && vv.height) || window.innerHeight || H);
      var s = Math.min(w / W, h / H, 1);
      if (!(s > 0) || !isFinite(s)) s = 1;
      st.style.transform = (s === 1) ? 'none' : 'scale(' + s + ')';
      document.documentElement.style.width = w + 'px';
      document.documentElement.style.height = h + 'px';
      document.body.style.width = w + 'px';
      document.body.style.height = h + 'px';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 50); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
    fit(); setTimeout(fit, 0); setTimeout(fit, 100); setTimeout(fit, 500); setTimeout(fit, 2000);
  })();
</script>
</body>
</html>
